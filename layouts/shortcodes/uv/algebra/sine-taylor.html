
<style>
    .checkbox input {
        display: none;
    }

    .checkbox span:before {
        content: "[ ]";
        cursor: pointer;
    }

    .checkbox input:checked + span:before {
        content: "[x]";
    }
</style>

<div>
    <button onclick="startAnimation()">[Start]</button>
    <button onclick="stopAnimation()">[Stop]</button>
    <button onclick="resetAnimation()">[Reset]</button>
</div>

<label class="checkbox">
    <input type="checkbox" id="interpolateCheckbox" checked />
    <span></span>
    Interpolate
</label>

<div id="grafico"></div>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<script src="https://cdn.plot.ly/plotly-4.1.1.min.js"></script>

<script>
	var factorialMem = [];
	function factorial (n) {
		if (n === 0 || n === 1) { return 1; }
		if (factorialMem[n] > 0) { return factorialMem[n]; }
		return factorialMem[n] = factorial(n-1) * n;
	}
	
	function iterativeTaylor(x, n) {
		let res = 0;
		for (let k = 0; k <= n; k++) {
			let sign = (k % 2) === 0 ? 1 : -1;
			res += sign * Math.pow(x, 2 * k + 1) / factorial(2 * k + 1);
		}
		return res;
	}
	
	var taylorMem = new Map();
	function taylor(x, k) {
		let [res, lastN] = taylorMem.get(x) || [0, -1];
		
		if (lastN === k) {
			return res;
		}
		else if (lastN !== k-1) {
			res = iterativeTaylor(x, k);
		} else {
			let sign = (k % 2) === 0 ? 1 : -1;
			res += sign * Math.pow(x, 2 * k + 1) / factorial(2 * k + 1);
		}
		
		taylorMem.set(x, [res, k]);
		return res;
	}

    let a = 0;
    let lastN = 0;
	let running = false;
    let animationId = null;
    let interpolate = true;

    const checkbox = document.getElementById("interpolateCheckbox");

    checkbox.addEventListener("change", function () {
        interpolate = this.checked;
    });

    const x = [];
    for (let i = -10; i <= 10; i += 0.05) {
        x.push(i);
    }
    let currentTaylor = x.map(x => taylor(x, 0));

    const layout = {
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',

        font: {
            color: '#fff'
        },
        autosize: true,
        xaxis: {
            range: [-10, 10],
            linecolor: '#444',
            zerolinecolor: '#fff',
            tickfont: { color: '#fff' },
            gridcolor: '#444'
        },
        yaxis: {
            range: [-1.5, 1.5],
            linecolor: '#444',
            zerolinecolor: '#fff',
            tickfont: { color: '#fff' },
            gridcolor: '#444'
        }
    };

    const config = {
        responsive: true,
        staticPlot: true
    };

    Plotly.newPlot("grafico", [
        {
            x: x,
            y: x.map(x => Math.sin(x)),
            mode: "lines",
            name: "$\\sin(x)$"
        },
        {
            x: x,
            y: x.map(x => taylor(x, 0)),
            mode: "lines",
            name: '$\\sum_{k=0}^{' + a + '} \\frac{(-1)^k}{(2k+1)!} x^{2k+1}$',
        }
    ], layout, config);
	
    function animate() {
		if (!running) { return; }
		
        a += 0.02;
		let n = Math.floor(a);
        if (lastN !== n) {
            lastN = n;
            currentTaylor = x.map(x => taylor(x, n));
            console.log(n);
        }

        let percentage = a - n;

        let y = interpolate ? x.map((x, i) => currentTaylor[i] * (1 - percentage) + percentage * taylor(x, n+1)) : currentTaylor;

		Plotly.restyle("grafico", {
			y: [
				x.map(x => Math.sin(x)),
                y
			],
			name: [
				"$\\sin(x)$",
				'$\\sum_{k=0}^{' + n + '} \\frac{(-1)^k}{(2k+1)!} x^{2k+1}$'
			]
		});

        animationId = requestAnimationFrame(animate);
    }

	function startAnimation() {
        if (running) { return; }

        running = true;
        animationId = requestAnimationFrame(animate);
    }

    function stopAnimation() {
        running = false;

        if (animationId !== null) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
    }

    function resetAnimation() {
        stopAnimation();

        a = 0;
        currentTaylor = null;
        taylorMem.clear();

		Plotly.restyle("grafico", {
			y: [
				x.map(x => Math.sin(x)),
				x.map(x => taylor(x, 0))
			],
			name: [
				"$\\sin(x)$",
				'$\\sum_{k=0}^{0} \\frac{(-1)^k}{(2k+1)!} x^{2k+1}$'
			]
		});
    }

    animate();
</script>
